global
    log /dev/log local0
    maxconn 4096

defaults
    log     global
    mode    tcp
    timeout connect 5s
    timeout client  120s
    timeout server  120s

# Single entry point for aria2. It opens many TCP connections per file
# (its segment/split downloads). Each NEW connection is handed to the
# next backend in round-robin order, so about half of the segments of one
# file go out through path 1 (8080) and half through path 2 (18081).
#
# SECURITY: 0.0.0.0 lets other devices in the home network use the proxy.
# It has no authentication, so do not forward this port on the router.
# Safer: bind to the LAN address of the server, e.g. 192.168.x.x:3128.
frontend aria2_in
    bind 0.0.0.0:3128
    default_backend singbox_paths

backend singbox_paths
    balance roundrobin
    server path1 127.0.0.1:8080 check
    server path2 127.0.0.1:18081 check
